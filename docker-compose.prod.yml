services:

  # db:
  #   image: postgres:14.20
  #   restart: always
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: admin
  #     POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ./postgres-init:/docker-entrypoint-initdb.d
  #   networks:
  #     - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    restart: always
    command:
      - start
      - --http-enabled=true
      - --hostname=${KEYCLOAK_HOSTNAME}
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    volumes:
      - ./providers:/opt/keycloak/providers
      - ./keycloak-theme/duplex:/opt/keycloak/themes/duplex
    networks:
      - app-network

  # rabbitmq:
  #   image: rabbitmq:4.2.5-management
  #   restart: always
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   networks:
  #     - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: https://${KEYCLOAK_HOSTNAME}

      APP_BASE_URL: https://${APP_HOSTNAME}

      RABBITMQ_HOST: ${CLOUDAMQP_HOST}
      RABBITMQ_PORT: ${CLOUDAMQP_PORT}
      RABBITMQ_USERNAME: ${CLOUDAMQP_USERNAME}
      RABBITMQ_PASSWORD: ${CLOUDAMQP_PASSWORD}
      RABBITMQ_VHOST: ${CLOUDAMQP_VHOST}
      RABBITMQ_SSL_ENABLED: ${CLOUDAMQP_SSL_ENABLED}

      KEYCLOAK_FRONTEND_CLIENT_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}

    depends_on:
      - keycloak
    networks:
      - app-network

  insurance:
    build:
      context: .
      dockerfile: Dockerfile.insurance
    restart: always
    environment:
      SPRING_RABBITMQ_HOST: ${CLOUDAMQP_HOST}
      SPRING_RABBITMQ_PORT: ${CLOUDAMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${CLOUDAMQP_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${CLOUDAMQP_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${CLOUDAMQP_VHOST}
      SPRING_RABBITMQ_SSL_ENABLED: ${CLOUDAMQP_SSL_ENABLED}
    networks:
      - app-network

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - keycloak
    networks:
      - app-network

volumes:
  postgres-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
