# Keycloak Configuration
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:9090}
keycloak.realm=patient-portal

# Public Keycloak URL used by the browser
keycloak.issuer-url=${KEYCLOAK_ISSUER_URL:http://localhost:9090}

# Internal Keycloak URL used by the frontend container
keycloak.internal-url=${KEYCLOAK_BASE_URL:http://localhost:9090}

# Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.internal-url}/realms/patient-portal/protocol/openid-connect/certs

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.issuer-url}/realms/patient-portal/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.internal-url}/realms/patient-portal/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.internal-url}/realms/patient-portal/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.internal-url}/realms/patient-portal/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Client Configuration
spring.security.oauth2.client.registration.keycloak.client-id=frontend
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_FRONTEND_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Keycloak Admin Client Configuration
keycloak.client-id=backend-service
keycloak.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}

# Keycloak Account and Password URLs
keycloak.account-url=${keycloak.issuer-url}/realms/${keycloak.realm}/account
keycloak.password-url=${keycloak.account-url}/account-security/signing-in


# Application URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Rabitmq
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:insurance}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:password}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}


# Error
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
spring.thymeleaf.cache=false

# Pageable limit
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.max-page-size=20



